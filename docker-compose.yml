services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-backend
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=false
      - DATABASE_URL=sqlite:////app/data/knowledge.db
      - RAGFLOW_URL=${RAGFLOW_URL:-http://ragflow:9380}
      - RAGFLOW_API_KEY=${RAGFLOW_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/data
      - backend_temp:/tmp/ragflow_uploads
    networks:
      - knowledge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - knowledge-net
    restart: unless-stopped

networks:
  knowledge-net:
    external: true
    name: knowledge-net

volumes:
  backend_data:
  backend_temp: